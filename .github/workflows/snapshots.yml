# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Snapshot Tests"

on:
  pull_request:
  push:
    branches:
      - "master"
      - "development"
      - "test"

jobs:

  tests:

    name: "Tests"

    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"

      - name: Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript

      - name: Change ImageMagick policy to allow pdf->png conversion.
        run: |
          sudo sed -i 's/none/read|write/' /etc/ImageMagick-6/policy.xml               

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "8.5"
          extensions: "mbstring, gd, bcmath, bz2, imagick"
          tools: composer:v2
          ini-values: error_reporting=-1

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Snapshot Tests"
        run: composer test -- --group=snapshot

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: "phpunit-artifact"
          path: tmp/artifacts/
          if-no-files-found: ignore